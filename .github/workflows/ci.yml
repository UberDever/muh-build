# The integration suite runs on an in-memory host, so it runs the same on every platform:
# build the vendored Lua with the platform's C compiler, then run the suite.
name: ci

on: [push, pull_request]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Build Lua
        run: |
          mkdir -p build
          case "$RUNNER_OS" in
            Linux)   cc  -std=c99 -O2 -DLUA_USE_LINUX  -o build/lua     vendor/lua-5.5.1/*.c -lm -ldl ;;
            macOS)   cc  -std=c99 -O2 -DLUA_USE_POSIX -DLUA_USE_DLOPEN -o build/lua vendor/lua-5.5.1/*.c ;;
            Windows) gcc -std=c99 -O2                  -o build/lua.exe vendor/lua-5.5.1/*.c ;;
          esac

      - name: Integration suite
        run: build/lua integration/runner.lua
